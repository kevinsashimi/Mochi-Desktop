name: Prepare manual release downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
      - name: Check out the tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Verify and package the committed executable
        run: python3 'Project Files/build-tools/package-manual-release.py' "$RELEASE_TAG" "$RUNNER_TEMP/downloads"
      - name: Upload tested downloads to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Published releases cannot be changed"' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mochi Desktop ${RELEASE_TAG#v}" --notes-file 'Project Files/MANUAL-RELEASE-NOTES.md'
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/downloads/Mochi.exe" "$RUNNER_TEMP/downloads/Mochi-Desktop-${RELEASE_TAG#v}.zip" "$RUNNER_TEMP/downloads/SHA256SUMS.txt"
